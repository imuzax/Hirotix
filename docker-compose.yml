services:
  hirotix-db:
    image: mysql:8.0
    container_name: hirotix-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: XAZUM
      MYSQL_DATABASE: hirotix_db
    ports:
      - "3307:3306"
    volumes:
      - hirotix-db-data:/var/lib/mysql
      - ./database/hirotix_db.sql:/docker-entrypoint-initdb.d/hirotix_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pXAZUM"]
      timeout: 10s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: ai-service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - GROQ_API_KEY=gsk_YOUR_GROQ_API_KEY_HERE
      - PORT=5000

  backend:
    build:
      context: ./backend/hirotix-backend
    container_name: hirotix-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=hirotix-db
      - DB_PORT=3306
      - DB_NAME=hirotix_db
      - DB_USER=root
      - DB_PASSWORD=XAZUM
      - AI_SERVICE_HOST=ai-service
    depends_on:
      hirotix-db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: hirotix-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-service

volumes:
  hirotix-db-data:
