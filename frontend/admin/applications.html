<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Flow - Hirotix Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="../js/theme.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="admin-mode">
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="brand">
                <a href="../index.html" class="logo-brand">
                    <span class="brand-text" style="color: var(--admin-text); font-size: 1.8rem; font-weight: 800;">Hirotix<span class="brand-dot">.</span></span>
                </a>
            </div>

            <nav>
                <ul class="admin-nav">
                    <li><a href="index.html" class="admin-nav-item"><ion-icon name="speedometer-outline"></ion-icon> Dashboard</a></li>
                    <li><a href="users.html" class="admin-nav-item"><ion-icon name="people-outline"></ion-icon> Users</a></li>
                    <li><a href="jobs.html" class="admin-nav-item"><ion-icon name="briefcase-outline"></ion-icon> Job Board</a></li>
                    <li><a href="applications.html" class="admin-nav-item active"><ion-icon name="document-text-outline"></ion-icon> Applications</a></li>
                    <li><a href="messages.html" class="admin-nav-item"><ion-icon name="mail-unread-outline"></ion-icon> Messages</a></li>
                    <li><a href="analytics.html" class="admin-nav-item"><ion-icon name="stats-chart-outline"></ion-icon> Analytics</a></li>
                </ul>
            </nav>

            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
                <button onclick="logout()" class="admin-nav-item" style="border: none; background: transparent; cursor: pointer; width: 100%; text-align: left;">
                    <ion-icon name="log-out-outline"></ion-icon> Log out
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="admin-main">
            <header class="admin-header fade-up">
                <div>
                    <h1>Global Application Flow</h1>
                    <p style="color: var(--admin-text-secondary);">Monitor matches between talent and opportunity.</p>
                </div>
            </header>

            <div class="admin-table-section fade-up">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Candidate</th>
                            <th>Applied For</th>
                            <th>Recruiter / Company</th>
                            <th>Match Score</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="applications-table">
                        <tr><td colspan="5" style="text-align:center; padding: 40px; color: #555;">Syncing application streams...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const user = getCurrentUser();
        if(!user || user.role !== 'ADMIN') window.location.href = 'login.html';
        
        function logout() {
            localStorage.removeItem('hirotix_user');
            window.location.href = 'login.html';
        }

        async function loadApplications() {
            const apps = await getAdminApplications();
            const table = document.getElementById('applications-table');
            
            if(apps.length === 0) {
                table.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">No applications currently active.</td></tr>';
                return;
            }

            table.innerHTML = apps.map(app => `
                <tr class="fade-up">
                    <td>
                        <div style="font-weight: 700;">${app.seeker ? app.seeker.fullName : 'Identity Purged'}</div>
                        <div style="font-size: 0.75rem; color: var(--admin-text-secondary);">${app.seeker ? app.seeker.email : 'No Contact'}</div>
                        ${app.seeker ? `<a href="${getResumeViewUrl(app.seeker.id)}" target="_blank" style="font-size: 0.7rem; color: var(--admin-accent); text-decoration: none; display: flex; align-items: center; gap: 4px; margin-top: 5px;"><ion-icon name="document-outline"></ion-icon> View Resume</a>` : ''}
                    </td>
                    <td>
                        <div style="font-weight: 600; color: var(--admin-accent);">${app.job ? app.job.title : 'Deleted Position'}</div>
                        <div style="font-size: 0.7rem; color: var(--admin-text-secondary);">${app.job ? app.job.company : '---'}</div>
                    </td>
                    <td>
                        <div style="font-size: 0.9rem;">${app.job && app.job.recruiter ? app.job.recruiter.fullName : 'Identity Purged'}</div>
                    </td>
                    <td>
                        <div style="background: rgba(50, 215, 75, 0.1); color: #32D74B; display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.8rem;">
                            ${app.matchScore ? app.matchScore.toFixed(0) : '0'}% Match
                        </div>
                    </td>
                    <td>
                        <span class="role-badge ${app.status === 'SHORTLISTED' ? 'role-seeker' : 'role-recruiter'}" style="background: ${app.status === 'REJECTED' ? '#ff3b30' : ''}">${app.status}</span>
                    </td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadApplications);
    </script>
</body>
</html>
