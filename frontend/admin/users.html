<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Hirotix Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="brand-icon"></div>
                <span class="brand-text">Hirotix Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><ion-icon name="speedometer-outline"></ion-icon> Dashboard</a>
                <a href="users.html" class="nav-item active"><ion-icon name="people-outline"></ion-icon> User Management</a>
                <a href="jobs.html" class="nav-item"><ion-icon name="briefcase-outline"></ion-icon> Job Board</a>
                <a href="applications.html" class="nav-item"><ion-icon name="document-text-outline"></ion-icon> Applications</a>
                <a href="analytics.html" class="nav-item"><ion-icon name="bar-chart-outline"></ion-icon> Analytics</a>
                <a href="#" class="nav-item logout" id="adminLogout"><ion-icon name="log-out-outline"></ion-icon> Logout</a>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="content-header">
                <div class="header-title">
                    <h1>User Management</h1>
                    <p>Audit, edit, or remove platform participants</p>
                </div>
                <div class="header-actions">
                    <div class="admin-search">
                        <ion-icon name="search-outline"></ion-icon>
                        <input type="text" id="userSearch" placeholder="Search users by name or email...">
                    </div>
                </div>
            </header>

            <div class="admin-card">
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersListTable">
                            <!-- Injected by admin.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="admin-modal">
        <div class="modal-content">
            <h3>Edit User Role</h3>
            <p id="editUserEmail" style="margin-bottom: 20px; color: #888;"></p>
            <div class="form-group">
                <label>Select Role</label>
                <select id="editUserRole" class="admin-select">
                    <option value="SEEKER">Job Seeker</option>
                    <option value="RECRUITER">Recruiter</option>
                    <option value="ADMIN">Administrator</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn-primary" id="saveUserRole">Update Role</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
