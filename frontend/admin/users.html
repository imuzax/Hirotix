<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Hirotix Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="../js/theme.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="admin-mode">
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="brand">
                <a href="../index.html" class="logo-brand">
                    <span class="brand-text" style="color: var(--admin-text); font-size: 1.8rem; font-weight: 800;">Hirotix<span class="brand-dot">.</span></span>
                </a>
            </div>

            <nav>
                <ul class="admin-nav">
                    <li><a href="index.html" class="admin-nav-item"><ion-icon name="speedometer-outline"></ion-icon> Dashboard</a></li>
                    <li><a href="users.html" class="admin-nav-item active"><ion-icon name="people-outline"></ion-icon> Users</a></li>
                    <li><a href="jobs.html" class="admin-nav-item"><ion-icon name="briefcase-outline"></ion-icon> Job Board</a></li>
                    <li><a href="applications.html" class="admin-nav-item"><ion-icon name="document-text-outline"></ion-icon> Applications</a></li>
                    <li><a href="messages.html" class="admin-nav-item"><ion-icon name="mail-unread-outline"></ion-icon> Messages</a></li>
                    <li><a href="analytics.html" class="admin-nav-item"><ion-icon name="stats-chart-outline"></ion-icon> Analytics</a></li>
                </ul>
            </nav>

            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
                <button onclick="logout()" class="admin-nav-item" style="border: none; background: transparent; cursor: pointer; width: 100%; text-align: left;">
                    <ion-icon name="log-out-outline"></ion-icon> Log out
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="admin-main">
            <header class="admin-header fade-up">
                <div>
                    <h1>User Management</h1>
                    <p style="color: var(--admin-text-secondary);">Manage, analyze, and remove identities from the platform.</p>
                </div>
                <div style="display: flex; gap: 15px; background: var(--admin-sidebar); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--admin-border);">
                    <ion-icon name="search-outline" style="color: var(--admin-text-secondary);"></ion-icon>
                    <input type="text" id="userSearch" placeholder="Search by name or email..." style="background:transparent; border:none; color:white; outline:none; font-size: 0.9rem; width: 250px;">
                </div>
            </header>

            <div class="admin-table-section fade-up">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Member</th>
                            <th>Email Address</th>
                            <th>Role / Clearance</th>
                            <th>Onboarding Date</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- Filled by admin.js -->
                        <tr><td colspan="5" style="text-align:center; padding: 40px; color: #555;">Retrieving users from global database...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const user = getCurrentUser();
        if(!user || user.role !== 'ADMIN') window.location.href = 'login.html';
        
        function logout() {
            localStorage.removeItem('hirotix_user');
            window.location.href = '../index.html';
        }

        // On Load
        document.addEventListener('DOMContentLoaded', loadAllUsersView);
        document.getElementById('userSearch').addEventListener('input', filterUsers);
    </script>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal-overlay">
        <div class="modal-window" style="max-width: 500px;">
            <div class="modal-header">
                <h3>Modify Identity</h3>
                <button class="modal-close" onclick="closeEditUserModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editUserForm" class="admin-form" onsubmit="handleUpdateUser(event)">
                    <div class="admin-form-group">
                        <label>Full Identity Name</label>
                        <input type="text" id="editUserName" class="admin-input" required>
                    </div>
                    <div class="admin-form-group">
                        <label>Registered Email</label>
                        <input type="email" id="editUserEmail" class="admin-input" required>
                    </div>
                    <div class="admin-form-group">
                        <label>Clearance Level (Role)</label>
                        <select id="editUserRole" class="admin-input admin-select">
                            <option value="SEEKER">SEEKER</option>
                            <option value="RECRUITER">RECRUITER</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                    </div>
                    
                    <div style="margin-top: 20px; display: flex; gap: 12px;">
                        <button type="submit" id="saveUserBtn" class="btn btn-accent" style="flex: 1; padding: 14px; border-radius: 12px; font-weight: 700;">Commit Changes</button>
                        <button type="button" class="btn btn-outline" onclick="closeEditUserModal()" style="flex: 0.5; padding: 14px; border-radius: 12px; font-weight: 700; color: white; border-color: rgba(255,255,255,0.1);">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
