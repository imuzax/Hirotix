<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Analytics - Hirotix Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="brand-icon"></div>
                <span class="brand-text">Hirotix Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><ion-icon name="speedometer-outline"></ion-icon> Dashboard</a>
                <a href="users.html" class="nav-item"><ion-icon name="people-outline"></ion-icon> User Management</a>
                <a href="jobs.html" class="nav-item"><ion-icon name="briefcase-outline"></ion-icon> Job Board</a>
                <a href="applications.html" class="nav-item"><ion-icon name="document-text-outline"></ion-icon> Applications</a>
                <a href="analytics.html" class="nav-item active"><ion-icon name="bar-chart-outline"></ion-icon> Analytics</a>
                <a href="#" class="nav-item logout" id="adminLogout"><ion-icon name="log-out-outline"></ion-icon> Logout</a>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="content-header">
                <h1>Platform Analytics</h1>
                <p>Growth metrics and engagement data</p>
            </header>

            <div class="admin-grid-2">
                <div class="admin-card">
                    <div class="card-header"><h2>User Acquisition</h2></div>
                    <canvas id="userChart"></canvas>
                </div>
                <div class="admin-card">
                    <div class="card-header"><h2>Application Funnel</h2></div>
                    <canvas id="appChart"></canvas>
                </div>
            </div>

            <div class="admin-card mt-4">
                <div class="card-header"><h2>Job Market Trends</h2></div>
                <canvas id="jobTrendChart" height="100"></canvas>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mock data for visual demo - Real system would fetch from /admin/stats
            const ctx1 = document.getElementById('userChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'New Users',
                        data: [12, 19, 15, 25, 22, 30, 45],
                        borderColor: '#0071e3',
                        backgroundColor: 'rgba(0, 113, 227, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            const ctx2 = document.getElementById('appChart').getContext('2d');
            new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: ['Applied', 'Screening', 'Interview', 'Hired'],
                    datasets: [{
                        data: [120, 85, 40, 15],
                        backgroundColor: ['#0071e3', '#34c759', '#ff9500', '#5856d6']
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        });
    </script>
    <script src="../js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
