iske andar<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Analytics - Hirotix Command</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="../js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 30px;
        }
        .chart-card {
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            border-radius: 24px;
            padding: 30px;
            height: 400px;
        }
        .chart-card h3 {
            margin-bottom: 25px;
            font-size: 1.1rem;
            color: var(--admin-text);
        }
    </style>
</head>
<body class="admin-mode">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="brand">
                <a href="../index.html" class="logo-brand">
                    <span class="brand-text" style="color: var(--admin-text); font-size: 1.8rem; font-weight: 800;">Hirotix<span class="brand-dot">.</span></span>
                </a>
            </div>
            <nav>
                <ul class="admin-nav">
                    <li><a href="index.html" class="admin-nav-item"><ion-icon name="speedometer-outline"></ion-icon> Dashboard</a></li>
                    <li><a href="users.html" class="admin-nav-item"><ion-icon name="people-outline"></ion-icon> Users</a></li>
                    <li><a href="jobs.html" class="admin-nav-item"><ion-icon name="briefcase-outline"></ion-icon> Job Board</a></li>
                    <li><a href="applications.html" class="admin-nav-item"><ion-icon name="document-text-outline"></ion-icon> Applications</a></li>
                    <li><a href="messages.html" class="admin-nav-item"><ion-icon name="mail-unread-outline"></ion-icon> Messages</a></li>
                    <li><a href="analytics.html" class="admin-nav-item active"><ion-icon name="stats-chart-outline"></ion-icon> Analytics</a></li>
                </ul>
            </nav>
            <div style="margin-top: auto;">
                <button onclick="logout()" class="admin-nav-item" style="border: none; background: transparent; cursor: pointer; width: 100%; text-align: left;">
                    <ion-icon name="log-out-outline"></ion-icon> Log out
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header fade-up">
                <div>
                    <h1>Platform Intelligence</h1>
                    <p style="color: var(--admin-text-secondary);">Core metrics and growth trajectories.</p>
                </div>
            </header>

            <div class="analytics-grid">
                <div class="chart-card fade-up" style="animation-delay: 0.1s;">
                    <h3>Identity Distribution</h3>
                    <canvas id="identityChart"></canvas>
                </div>
                <div class="chart-card fade-up" style="animation-delay: 0.2s;">
                    <h3>Platform Activity (7D)</h3>
                    <canvas id="activityChart"></canvas>
                </div>
                <div class="chart-card fade-up" style="animation-delay: 0.3s;">
                    <h3>Application Funnel</h3>
                    <canvas id="funnelChart"></canvas>
                </div>
                <div class="chart-card fade-up" style="animation-delay: 0.4s;">
                    <h3>Geographic Demand</h3>
                    <canvas id="geoChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const user = getCurrentUser();
        if(!user || user.role !== 'ADMIN') window.location.href = 'login.html';
        
        function logout() {
            localStorage.removeItem('hirotix_user');
            window.location.href = 'login.html';
        }

        async function initAnalytics() {
            const stats = await getAdminStats();
            
            // Identity Distribution
            new Chart(document.getElementById('identityChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Seekers', 'Recruiters', 'Admins'],
                    datasets: [{
                        data: [stats.totalSeekers, stats.totalRecruiters, 1],
                        backgroundColor: ['#32D74B', '#FF9F0A', '#007AFF'],
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: '#8e8e93' }}}}
            });

            // Activity Chart (Mocked trend based on stats)
            new Chart(document.getElementById('activityChart'), {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Logins',
                        data: [12, 19, 15, 25, 22, 30, 45],
                        borderColor: '#007AFF',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(0, 122, 255, 0.1)'
                    }]
                },
                options: { maintainAspectRatio: false, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#8e8e93' }}}, plugins: { legend: { display: false }}}
            });

            // Funnel Chart
            new Chart(document.getElementById('funnelChart'), {
                type: 'bar',
                data: {
                    labels: ['Visits', 'Job Views', 'Applications', 'Hires'],
                    datasets: [{
                        data: [500, 320, stats.totalApplications, 12],
                        backgroundColor: '#FF375F',
                        borderRadius: 8
                    }]
                },
                options: { maintainAspectRatio: false, indexAxis: 'y', scales: { x: { display: false }, y: { ticks: { color: '#8e8e93' }, grid: { display: false }}}, plugins: { legend: { display: false }}}
            });

            // Geographic (Mocked)
            new Chart(document.getElementById('geoChart'), {
                type: 'polarArea',
                data: {
                    labels: ['Mumbai', 'Pune', 'Bangalore', 'Remote', 'Other'],
                    datasets: [{
                        data: [40, 35, 25, 50, 15],
                        backgroundColor: ['rgba(0,122,255,0.5)', 'rgba(50,215,75,0.5)', 'rgba(255,159,10,0.5)', 'rgba(175,82,222,0.5)', 'rgba(254,44,85,0.5)'],
                        borderColor: 'transparent'
                    }]
                },
                options: { maintainAspectRatio: false, scales: { r: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { display: false }}}, plugins: { legend: { position: 'bottom', labels: { color: '#8e8e93' }}}}
            });
        }

        document.addEventListener('DOMContentLoaded', initAnalytics);
    </script>
</body>
</html>
