<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hirotix</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/theme.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <!-- Abstract Background for Glass Effect -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3" style="background:#e0c3fc; top:auto; bottom:20%; left:-10%;"></div>

    <!-- Navigation -->
    <nav class="navbar glass" style="top: 20px;">
        <a href="index.html" class="logo-brand">
            <div class="brand-icon" style="width: 36px; height: 36px;"></div>
            <span class="brand-text" style="font-size: 1.6rem;">Hirotix<span class="brand-dot">.</span></span>
        </a>
        <div class="nav-buttons">
            <a href="login.html" class="btn btn-outline"
                style="padding: 8px 20px; border-radius: 99px; border: 1px solid #1d1d1f; color: #1d1d1f; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.3s; display: inline-block;">Log
                In</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="auth-container">
        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Create an account</h2>
                <p>Join Hirotix to find or post jobs</p>
            </div>

            <!-- Auth Tabs (Seeker vs Recruiter) -->
            <div class="auth-tabs" id="roleTabs">
                <button type="button" class="tab-btn active" data-role="SEEKER">Job Seeker</button>
                <button type="button" class="tab-btn" data-role="RECRUITER">Recruiter</button>
            </div>

            <form id="registerForm" class="auth-form">
                <input type="hidden" id="role" value="SEEKER">
                <div id="registerMessage" class="form-message"></div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" required placeholder="Your Name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@domain.com" 
                           oninput="this.value = this.value.toLowerCase()">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper" style="position: relative;">
                        <input type="password" id="password" class="form-control" required
                            placeholder="Create a strong password" oninput="checkPasswordStrength(this.value)">
                    </div>
                    <!-- Password Strength UI -->
                    <div class="strength-meter" style="margin-top: 10px;">
                        <div class="strength-bars" style="display: flex; gap: 4px; height: 4px; margin-bottom: 8px;">
                            <div class="bar" style="flex:1; background: #eee; border-radius: 2px; transition: 0.3s;"></div>
                            <div class="bar" style="flex:1; background: #eee; border-radius: 2px; transition: 0.3s;"></div>
                            <div class="bar" style="flex:1; background: #eee; border-radius: 2px; transition: 0.3s;"></div>
                            <div class="bar" style="flex:1; background: #eee; border-radius: 2px; transition: 0.3s;"></div>
                        </div>
                        <p id="strengthText" style="font-size: 0.75rem; color: #666; margin: 0;">Password security level</p>
                    </div>
                    
                    <div class="password-guide" style="margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.03); border-radius: 8px; font-size: 0.75rem;">
                        <p style="margin-bottom: 8px; font-weight: 600; color: #333;">Strength Checklist:</p>
                        <ul style="list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                            <li id="rule-length" style="color: #999;"><ion-icon name="ellipse-outline" style="font-size: 8px; margin-right: 5px;"></ion-icon> 8+ Characters</li>
                            <li id="rule-upper" style="color: #999;"><ion-icon name="ellipse-outline" style="font-size: 8px; margin-right: 5px;"></ion-icon> Uppercase</li>
                            <li id="rule-num" style="color: #999;"><ion-icon name="ellipse-outline" style="font-size: 8px; margin-right: 5px;"></ion-icon> Number</li>
                            <li id="rule-special" style="color: #999;"><ion-icon name="ellipse-outline" style="font-size: 8px; margin-right: 5px;"></ion-icon> Special Char</li>
                        </ul>
                    </div>
                </div>

                <button type="submit" class="btn btn-large btn-primary w-100" id="registerBtn" disabled>
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // Password Strength Logic
        function checkPasswordStrength(password) {
            const rules = {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                num: /[0-9]/.test(password),
                special: /[^A-Za-z0-9]/.test(password)
            };

            const ruleElements = {
                length: document.getElementById('rule-length'),
                upper: document.getElementById('rule-upper'),
                num: document.getElementById('rule-num'),
                special: document.getElementById('rule-special')
            };

            // Update icons and colors for checklist
            Object.keys(ruleElements).forEach(rule => {
                const el = ruleElements[rule];
                if (rules[rule]) {
                    el.style.color = '#34c759';
                    el.querySelector('ion-icon').name = 'checkmark-circle';
                } else {
                    el.style.color = '#999';
                    el.querySelector('ion-icon').name = 'ellipse-outline';
                }
            });

            // Calculate strength points
            let strength = 0;
            if (rules.length) strength++;
            if (rules.upper && rules.lower) strength++;
            if (rules.num) strength++;
            if (rules.special) strength++;

            const bars = document.querySelectorAll('.bar');
            const strengthText = document.getElementById('strengthText');
            const registerBtn = document.getElementById('registerBtn');

            // Reset bars
            bars.forEach(bar => bar.style.background = '#eee');

            const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759'];
            const labels = ['Weak - Needs improvement', 'Fair - Getting there', 'Good - Strong enough', 'Excellent - Very secure'];

            if (password.length > 0) {
                for (let i = 0; i < strength; i++) {
                    bars[i].style.background = colors[strength - 1];
                }
                strengthText.textContent = labels[strength - 1];
                strengthText.style.color = colors[strength - 1];
            } else {
                strengthText.textContent = 'Password security level';
                strengthText.style.color = '#666';
            }

            // Enable button only if strength is at least 3 (Good)
            registerBtn.disabled = strength < 3;
        }

        // Handle Role Tabs
        const tabs = document.querySelectorAll('.tab-btn');
        const roleInput = document.getElementById('role');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                roleInput.value = tab.getAttribute('data-role');
            });
        });

        // Form Submit
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: roleInput.value
            };

            const msgDiv = document.getElementById('registerMessage');
            const btn = document.getElementById('registerBtn');

            try {
                // Disable button and show loading state
                btn.disabled = true;
                btn.innerHTML = '<span>Creating account...</span>';
                msgDiv.className = 'form-message';

                const response = await register(payload);

                msgDiv.textContent = 'Registration successful! Redirecting to login...';
                msgDiv.className = 'form-message success';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                msgDiv.textContent = error.message || 'Registration failed. Email might already be in use.';
                msgDiv.className = 'form-message error';
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span>';
            }
        });

        // Add a simple redirect if already logged in (for convenience)
        window.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (user) {
                if (user.role === 'SEEKER') window.location.href = 'seeker-dashboard.html';
                else if (user.role === 'RECRUITER') window.location.href = 'recruiter-dashboard.html';
            }
        });
    </script>
</body>

</html>
